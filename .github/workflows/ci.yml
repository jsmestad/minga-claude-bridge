name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, compile, lint, test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Erlang/OTP and Elixir
        id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and _build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Credo
        run: mix credo --strict

      - name: Test
        run: mix test

      # ex_doc is a dev-only dependency, so the docs build in the dev environment.
      - name: Docs
        run: mix docs
        env:
          MIX_ENV: dev

      # Builds the Hex package without publishing it. The minga_sdk git dependency is
      # `only: [:dev, :test]`, so Hex leaves it out of the package and accepts the build.
      # The step fails when a listed package file is missing or a runtime git dependency appears.
      - name: Hex package
        run: mix hex.build --unpack -o "$RUNNER_TEMP/hex-package"
